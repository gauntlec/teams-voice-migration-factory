<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Handover packs use Calibri and Calibri Light. Carlito has Calibri's measurements, so a pack laid out with it breaks pages close to how Word does. -->
<fontconfig>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
</fontconfig>
