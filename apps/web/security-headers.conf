# Response headers for everything nginx serves itself (the app shell, its assets, /version.json). Included from each such location in
# nginx.conf, because a location that sets its own add_header (the Cache-Control ones) does not inherit the server-level ones.
# /api/ and /health are NOT included: the API sends its own (helmet) and nginx would only duplicate them.
# HSTS is not set here: nginx cannot tell whether the address in front of it is https (a customer install may be plain http on a LAN).
# Set it on the https front door (the installer's Caddy, or your reverse proxy).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Content-Security-Policy: scripts and connections only from the app's own address; map tiles from OpenStreetMap; geocoding and everything else
# goes through our own /api. 'unsafe-inline' for styles is needed by Fluent UI (Griffel) and Leaflet, which inject <style> and style="" at run
# time; scripts are NOT inline. It ran in Report-Only mode first and logged no violation on any page of a live instance (2026-10-16).
# Anything new the app loads from elsewhere (a CDN, an embedded frame, an external image) must be added here, or the browser blocks it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
