# Keep the scheme the outer reverse proxy (OpenResty) saw. Falls back to the
# scheme nginx itself received when there is no upstream header.
map $http_x_forwarded_proto $tvmf_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Discovery attachments + the generated handover .docx can be a few MB.
  # (The outer reverse proxy may enforce its own limit too.)
  client_max_body_size 25m;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The hashed asset bundles are immutable; cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must always be re-fetched, or a browser keeps loading an old
  # bundle after a deploy and hits "Cannot GET /api/..." for removed routes.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # API + auth proxied to the Nest service on the compose network
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $tvmf_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }
}
