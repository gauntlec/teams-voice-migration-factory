# Keep the scheme the outer reverse proxy (Caddy or OpenResty) saw. Falls back to the
# scheme nginx itself received when there is no upstream header.
map $http_x_forwarded_proto $tvmf_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  # Do not announce the nginx version.
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Discovery attachments + the generated handover .docx can be a few MB.
  # (The outer reverse proxy may enforce its own limit too.)
  client_max_body_size 25m;

  # Which release this is (written at image build). Never cached, so a deploy can be verified straight away.
  location = /version.json {
    add_header Cache-Control "no-store";
    include /etc/nginx/security-headers.conf;
  }

  # The hashed asset bundles are immutable; cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # SPA fallback. Every non-asset path resolves to index.html, which must always
  # be re-fetched or a browser keeps running an old bundle after a deploy and
  # hits "Cannot GET /api/..." for routes the new API removed.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/security-headers.conf;
  }

  # API + auth proxied to the Nest service on the compose network
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $tvmf_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Unauthenticated health check (db connectivity + clock) - proxied so it's
  # reachable without publishing the api container's port on the host.
  location = /health {
    proxy_pass http://api:4000/health;
    proxy_set_header Host $host;
  }
}
