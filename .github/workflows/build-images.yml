name: build-images

# Build the api / worker / web images and push them to GHCR on every push to
# main. Dockge then just pulls (`pull_policy: always`) — deploys drop from
# ~12 min to ~30 s. The three packages must be made Public once, in GitHub →
# your profile → Packages → tvmf-* → Package settings → Change visibility.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  # Weekly, unpinned worker-only build to a non-production :candidate tag -
  # surfaces a breaking MicrosoftTeams/Microsoft.Graph.Authentication
  # PSGallery release before anyone considers bumping the Dockerfile's pin.
  # Never touches :latest/production - see the build-candidate job below.
  schedule:
    - cron: '0 6 * * 1'

env:
  # Vulnerability scan of every built image (Trivy). Findings are always listed in the job summary and the log. In the `check` job any fixable
  # HIGH/CRITICAL finding (or embedded secret) FAILS the build (`scan_exit` per image), so it never ships. One file is skipped:
  # the Microsoft Teams module's _manifest/spdx_2.2/manifest.spdx.json is Microsoft's build bill of materials (it names npm and .NET packages
  # used to BUILD the module, not code in the image), and Trivy reads it as if those packages were installed (docs/SECURITY.md).
  # The weekly scan of the published images only reports.
  TRIVY_EXIT_CODE: '0'
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.0

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck every package + run packages/shared's unit tests and the
  # database-backed tests (tests/db) before any image build - a broken cmdlet
  # planner (the code that decides what Set-Cs*/New-Cs* runs against a real
  # customer tenant) used to be able to ship straight to GHCR/production with
  # nothing catching it. Runs on PRs too (not just push to main) so a broken
  # change is visible before merge.
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm install

      # apps/api|worker|web import @tvmf/shared and @tvmf/db by their built
      # dist/ output (package.json "main"/"types"), not src/ - typecheck
      # fails with "Cannot find module" on every consumer without this.
      - run: npm run build:packages

      - run: npm run typecheck --workspaces --if-present

      - run: npm run test --workspaces --if-present

      # The real api/worker services against a real Postgres 16 with every
      # migration applied (tests/db - one embedded Postgres for the run, a
      # fresh tenant schema per file). Catches data bugs unit tests can't see:
      # a number never freed, change history lost, a run stuck 'queued'.
      - run: npm run test:db

      # SECURITY.md and /.well-known/security.txt must show the same contact address (it lives in deploy/security/SECURITY_CONTACT_EMAIL).
      - name: Security contact is the same everywhere
        run: bash deploy/security/set-contact.sh --check

  # The release number: yyyy.mm.N, N counting from 1 within the month (UTC), e.g. 2026.10.1, 2026.10.2, then 2026.11.1. Worked out ONCE here
  # (the three image builds run in parallel and must agree) from the existing v<yyyy.mm.N> tags. It is only TAGGED by `release` below, after
  # every image built, so a failed build never uses up a number. Docs-only pushes do not build (paths-ignore above) and so are not releases.
  version:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ym=$(date -u +%Y.%m)
          last=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${ym}." --jq '.[].ref' | sed "s#refs/tags/v${ym}\.##" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          echo "version=${ym}.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  # Builds each image (nothing is pushed), proves it starts, and scans it. Nothing is published unless ALL THREE pass, so a blocked
  # scan on one image can never leave the others published on their own (the `publish` job below needs this whole job to succeed).
  check:
    needs: [verify, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            scan_exit: '1'
          - name: worker
            dockerfile: apps/worker/Dockerfile
            scan_exit: '1'
          - name: web
            dockerfile: apps/web/Dockerfile
            scan_exit: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 1. Build it locally (nothing is pushed), 2. prove it starts and runs unprivileged, 3. scan it. The `publish` job then pushes it.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          platforms: linux/amd64
          tags: tvmf-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # The only build-args are the release number and the commit: they say which build this is (shown in Platform settings, sent to a
          # Voxshift Hub, served as /version.json). They are used in the LAST layer of each image, so they never invalidate a cached layer:
          # the worker Dockerfile's TEAMS_MODULE_VERSION/GRAPH_MODULE_VERSION ARGs still default to the pinned versions (no CACHE_BUST),
          # which keeps the module-install layer fully cache-stable.
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            GIT_SHA=${{ github.sha }}

      - name: Smoke test
        run: .github/scripts/smoke-image.sh ${{ matrix.name }} tvmf-${{ matrix.name }}:ci

      - name: Scan for vulnerabilities and secrets
        run: |
          mkdir -p "$HOME/.cache/trivy"
          skip=(--skip-files "**/_manifest/spdx_2.2/manifest.spdx.json" --skip-files "usr/local/share/powershell/Modules/*/*/_manifest/spdx_2.2/manifest.spdx.json")
          rc=0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/" "$TRIVY_IMAGE" image \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed "${skip[@]}" --no-progress --exit-code "${{ matrix.scan_exit }}" \
            "tvmf-${{ matrix.name }}:ci" > scan.txt 2>&1 || rc=$?
          { echo "### tvmf-${{ matrix.name }} image scan (fixable HIGH and CRITICAL)"; echo '```'; cat scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat scan.txt
          # Where each finding lives (the table above does not say), so a finding in a vendor module can be told from one in our code.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/" "$TRIVY_IMAGE" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed "${skip[@]}" --no-progress --format json "tvmf-${{ matrix.name }}:ci" > scan.json 2>/dev/null || true
          jq -r '.Results[]? | select((.Vulnerabilities // []) | length > 0) | .Target as $t | .Vulnerabilities[] | "\($t) | \(.PkgName) \(.InstalledVersion) | \(.PkgPath // "-")"' scan.json | sort -u > where.txt
          { echo "#### Where the findings are"; echo '```'; cat where.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "WHERE THE FINDINGS ARE:"; cat where.txt
          exit "$rc"

  # Pushes the images (all three, only after `check` passed for all three), with a software bill of materials and build provenance.
  # The layers come from the cache `check` just wrote, so this is quick.
  publish:
    needs: [check, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tvmf-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=long

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            GIT_SHA=${{ github.sha }}

  # Tags the commit v<release number> and publishes a GitHub release with notes, once all three images are built and pushed.
  # The release also carries the installer (install.sh, uninstall.sh) and SHA256SUMS, a checksum file for them that is SIGNED here with
  # Sigstore (keyless: the signature proves this workflow in this repository made it, no key to keep). `voxshift self-update` and the
  # verified-install steps in docs/INSTALL-LINUX.md check these. If signing fails (Sigstore down), the release is still made without the
  # signature file and the job summary says so: the images are already published, so a missing signature must not leave them without a release.
  release:
    needs: [version, publish]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # lets cosign get a short-lived certificate for this workflow's identity (GitHub OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Checksums of the installer files
        run: |
          mkdir -p release-assets
          cp deploy/install/install.sh deploy/install/uninstall.sh release-assets/
          cd release-assets
          sha256sum install.sh uninstall.sh > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@v4
        with:
          cosign-release: 'v3.1.3'

      - name: Sign the checksums (Sigstore, keyless)
        id: sign
        continue-on-error: true
        working-directory: release-assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          files=(release-assets/install.sh release-assets/uninstall.sh release-assets/SHA256SUMS)
          if [ -s release-assets/SHA256SUMS.sigstore.json ]; then
            files+=(release-assets/SHA256SUMS.sigstore.json)
          else
            echo "::warning::The checksums were NOT signed (Sigstore signing failed). The release has install.sh, uninstall.sh and SHA256SUMS but no SHA256SUMS.sigstore.json."
            echo "### Release ${VERSION}: checksums not signed - see the 'Sign the checksums' step" >> "$GITHUB_STEP_SUMMARY"
          fi
          gh release create "v${VERSION}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes

  # Weekly only - see the `on.schedule` comment above. Builds just the
  # worker image, unpinned, to ghcr.io/.../tvmf-worker:candidate (never
  # :latest, never pushed to production by Dockge). Deliberately does not
  # depend on / block the `check` and `publish` jobs above.
  build-candidate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tvmf-worker
          tags: |
            type=raw,value=candidate

      - name: Build candidate (unpinned) - does not push to :latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker-candidate
          cache-to: type=gha,mode=max,scope=worker-candidate
          build-args: |
            TEAMS_MODULE_VERSION=
            GRAPH_MODULE_VERSION=
            CACHE_BUST=${{ github.run_id }}

  # Weekly: scan the images people are actually running (:latest) for newly published vulnerabilities, even when nothing was pushed.
  # Report only (see TRIVY_EXIT_CODE); the findings are in the job summary.
  scan-published:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: [api, worker, web]
    steps:
      - name: Scan the published image
        run: |
          mkdir -p "$HOME/.cache/trivy"
          skip=(--skip-files "**/_manifest/spdx_2.2/manifest.spdx.json" --skip-files "usr/local/share/powershell/Modules/*/*/_manifest/spdx_2.2/manifest.spdx.json")
          rc=0
          docker run --rm -v "$HOME/.cache/trivy:/root/.cache/" "$TRIVY_IMAGE" image \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed "${skip[@]}" --no-progress --exit-code "$TRIVY_EXIT_CODE" \
            "ghcr.io/${{ github.repository_owner }}/tvmf-${{ matrix.name }}:latest" > scan.txt 2>&1 || rc=$?
          { echo "### tvmf-${{ matrix.name }}:latest (published) - fixable HIGH and CRITICAL"; echo '```'; cat scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat scan.txt
          exit "$rc"
