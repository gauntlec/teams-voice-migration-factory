name: codeql

# GitHub code scanning (CodeQL) for the TypeScript / JavaScript code: looks for security mistakes in OUR code (injection, unsafe
# redirects, secrets in logs, weak crypto, path traversal ...). It is deliberately a separate workflow from build-images.yml: it never
# gates or delays a release. Findings appear under Security > Code scanning on GitHub, and on a pull request as a check.
# `build-mode: none` reads the source directly, so no build is needed. `security-extended` adds the broader security queries on top of the default set.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly (Wednesday, early morning UTC) so newly published queries are run against code that has not changed.
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write   # upload the results to code scanning
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
