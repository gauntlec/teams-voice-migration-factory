# Teams Voice Migration Factory — Dockge stack
# ---------------------------------------------------------------------------
# Paste this into Dockge's compose editor, paste deploy/dockge/.env.example
# (with real values) into the .env editor, then Start.
#
# Images are built by BuildKit directly from the public GitHub repo, so nothing
# but this compose.yaml and .env needs to live on the Dockge host.
# First start builds 3 images (~3-6 min); watch the build logs in Dockge.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tvmf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tvmf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tvmf} -d ${POSTGRES_DB:-tvmf}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: "https://github.com/gauntlec/teams-voice-migration-factory.git#main"
      dockerfile: apps/api/Dockerfile
    pull_policy: build   # `docker compose up` (Dockge "Update") rebuilds from the pinned git ref
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    # Apply platform migrations + upsert the bootstrap admin, then start.
    command: ["sh", "-c", "node packages/db/dist/migrate.js && node packages/db/dist/seed.js && node apps/api/dist/main.js"]
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: "https://github.com/gauntlec/teams-voice-migration-factory.git#main"
      dockerfile: apps/worker/Dockerfile
    pull_policy: build   # `docker compose up` (Dockge "Update") rebuilds from the pinned git ref
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: "https://github.com/gauntlec/teams-voice-migration-factory.git#main"
      dockerfile: apps/web/Dockerfile
    pull_policy: build   # `docker compose up` (Dockge "Update") rebuilds from the pinned git ref
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
